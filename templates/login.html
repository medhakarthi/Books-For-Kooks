{%extends "layout.html"%}

{%block body%}

<h1 style="text-align: center;"> Log In To Account </h1>
<form style="text-align: center;" action="/login" method="post">
    <input autocomplete="off" autofocus="on" required name="username" placeholder="Username" type="text">
    <p></p>
    <input autocomplete="off" autofocus="on" required name="password" placeholder="Password" type="text">
    <p></p>
    <button class="btn btn-primary" type="submit"> Log In </button>
</form>

{%endblock%}
